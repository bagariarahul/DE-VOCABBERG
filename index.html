<!DOCTYPE html>
<html lang="nl" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>De Vocabberg — 1020 woorden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F8F5;
  --ink:#0F2557;      /* delft deep */
  --delft:#1F4FA3;    /* delft blue */
  --tulip:#E8590C;    /* orange accent */
  --green:#2B8A3E;
  --green-bg:#E3F5E7;
  --red:#C92A2A;
  --red-bg:#FBEAEA;
  --line:#D8DCE6;
  --muted:#5C6577;
  --card:#FFFFFF;
  --sheetbg:#0F2557;
  --activebg:#0F2557;
  --activefg:#FFFFFF;
  --legbg:rgba(247,248,245,.92);
  --shadow-s:0 1px 2px rgba(15,37,87,.06);
  --shadow-h:0 4px 12px rgba(31,79,163,.14);
  --shadow-sheet:0 -10px 34px rgba(8,12,30,.30);
}
[data-theme="dark"]{
  --paper:#0E1220;
  --ink:#E9EEF8;
  --delft:#7FA3EF;
  --tulip:#FF8A3D;
  --green:#57C377;
  --green-bg:#17301F;
  --red:#E36868;
  --red-bg:#361D1C;
  --line:#2A3450;
  --muted:#93A0BC;
  --card:#161D31;
  --sheetbg:#0A0F1E;
  --activebg:#E9EEF8;
  --activefg:#0E1220;
  --legbg:rgba(14,18,32,.9);
  --shadow-s:none;
  --shadow-h:0 4px 14px rgba(0,0,0,.5);
  --shadow-sheet:0 -10px 34px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:4px;z-index:100;
  background:linear-gradient(90deg,#AE1C28 0 33.4%,#F5F6F2 33.4% 66.7%,#21468B 66.7% 100%)}
button:focus-visible{outline:2px solid var(--tulip);outline-offset:2px}
html,body{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 120px}

/* ---------- header ---------- */
header{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
  padding:22px 0 10px;
  border-bottom:3px solid var(--ink);
}
.brand{font-family:'Archivo',sans-serif;font-weight:900;font-stretch:110%;
  font-size:clamp(26px,4vw,38px);letter-spacing:-.02em;line-height:1}
.brand .accent{color:var(--tulip)}
.brand small{display:block;font-family:'Inter';font-weight:500;font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--delft);margin-top:6px}
.totals{text-align:right;font-family:'Archivo';font-weight:700}
.totals .big{font-size:clamp(22px,3vw,30px);font-weight:900}
.totals .big span{color:var(--green)}
.totals .sub{font-size:12px;font-weight:500;color:var(--muted);font-family:'Inter'}

.progress{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 2px}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--delft),var(--green));border-radius:99px}

/* ---------- mountain strip ---------- */
.mountain{
  display:flex;align-items:flex-end;gap:5px;
  overflow-x:auto;padding:26px 2px 12px;
  scrollbar-width:thin;
  border-bottom:1px solid var(--line);
}
.peak{
  flex:0 0 auto;width:52px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:none;border:none;font-family:inherit;color:inherit;padding:0;
}
.peak .bar{
  width:100%;border:1.5px solid var(--ink);border-radius:3px 3px 0 0;
  background:var(--card);position:relative;overflow:hidden;
}
.peak .fill{position:absolute;bottom:0;left:0;width:100%;background:var(--green);opacity:.85}
.peak .fill.partial{background:var(--delft)}
.peak.done .bar{border-color:var(--green)}
.peak .lbl{font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.peak .cnt{font-size:9.5px;color:var(--muted)}
.peak.active .lbl{color:var(--tulip);font-weight:700}
.peak.active .bar{border-color:var(--tulip);border-width:2px;box-shadow:0 0 0 2px rgba(232,89,12,.18)}
.peak:focus-visible{outline:2px solid var(--tulip);outline-offset:2px}
.peak:hover .bar{border-color:var(--delft)}
.mountain::-webkit-scrollbar{height:6px}
.mountain::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.mountain::-webkit-scrollbar-thumb:hover{background:var(--delft)}

/* ---------- day header ---------- */
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:14px 16px 12px;margin-top:16px;box-shadow:var(--shadow-s)}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 0 4px}
.dayhead h2{font-family:'Archivo';font-weight:900;font-size:clamp(20px,3vw,28px);letter-spacing:-.01em}
.dayhead h2 em{font-style:normal;color:var(--delft)}
.routine{font-size:12.5px;color:var(--muted)}
.routine b{color:var(--tulip)}
.daymeta{display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--muted)}
.daymeta .g,.daymeta .r{display:inline-flex;align-items:center;gap:6px;
  padding:3px 11px;border-radius:99px;font-weight:600;font-size:12px}
.daymeta .g{background:var(--green-bg);color:var(--green)}
.daymeta .r{background:var(--red-bg);color:var(--red)}
.daymeta .g::before,.daymeta .r::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.reset{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;
  font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit}
.reset:hover{border-color:var(--red);color:var(--red)}

/* ---------- grid ---------- */
.grid{
  display:grid;gap:8px;padding:14px 0 8px;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
}
.card{
  background:var(--card);
  border:1.5px solid var(--line);
  border-radius:10px;
  box-shadow:var(--shadow-s);
  touch-action:manipulation;
  padding:13px 10px 12px;
  font-family:'Archivo';font-weight:700;font-size:16.5px;letter-spacing:-.01em;
  text-align:center;cursor:pointer;user-select:none;
  position:relative;line-height:1.2;
  color:var(--ink);
}
.card .art{display:block;font-family:'Inter';font-weight:500;font-size:10.5px;color:var(--muted);letter-spacing:.02em;margin-bottom:2px}
.card.g{background:var(--green-bg);border-color:var(--green)}
.card.r{background:var(--red-bg);border-color:var(--red)}
.card.cur{outline:2.5px solid var(--tulip);outline-offset:1.5px;border-color:var(--tulip)}
.card .idx{position:absolute;top:4px;left:7px;font-family:'Inter';font-size:9px;font-weight:500;color:var(--muted);opacity:.7}
.card.g .idx{color:var(--green)}
.card.r .idx{color:var(--red)}
body:not(.show-idx) .card .idx{display:none}
.card:not(.g):not(.r):hover{border-color:var(--delft);box-shadow:var(--shadow-h);transform:translateY(-1px)}
.card:active{transform:translateY(0);box-shadow:var(--shadow-s)}
.card.g::after{content:"\2713";position:absolute;top:4px;right:7px;font-family:'Inter';
  font-size:10px;font-weight:700;color:var(--green)}
.card.r::after{content:"\2717";position:absolute;top:4px;right:7px;font-family:'Inter';
  font-size:10px;font-weight:700;color:var(--red)}
.card{scroll-margin-bottom:var(--sheetpad,0px);scroll-margin-top:6px}

/* ---------- popup / bottom sheet ---------- */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--sheetbg);color:#F2F5FB;
  transform:translateY(102%);
  border-top:4px solid var(--tulip);
  border-radius:16px 16px 0 0;
  box-shadow:var(--shadow-sheet);
  padding:18px 22px calc(16px + env(safe-area-inset-bottom));
}
.sheet.open{transform:translateY(0)}
.sheet::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
  width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.22)}
.sheet-inner{max-width:1180px;margin:0 auto;display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.sheet .word{font-family:'Archivo';font-weight:900;font-size:clamp(24px,4vw,34px);letter-spacing:-.01em;min-width:200px}
.sheet .pos{display:inline-block;font-family:'Inter';font-size:10.5px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--tulip);
  border:1px solid rgba(232,89,12,.55);border-radius:4px;padding:2px 7px;margin-top:8px}
.sheet .def{flex:1;min-width:220px}
.sheet .en{font-size:19px;font-weight:600;color:#fff;margin-bottom:6px}
.sheet .ex{font-size:14px;color:#B9C4DC;line-height:1.5}
.sheet .ex b{color:#E6ECF7;font-weight:600}
.sheet-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.sbtn{font-family:'Archivo';font-weight:700;font-size:14px;border-radius:8px;
  padding:10px 16px;cursor:pointer;border:1.5px solid transparent}
.sbtn.g{background:var(--green);color:#fff}
.sbtn.f{background:var(--red);color:#fff}
.sbtn.x{background:transparent;color:#B9C4DC;border-color:#3A4E7E}
.sheet .close{position:absolute;top:10px;right:14px;background:none;border:none;color:#8FA0C4;
  font-size:20px;cursor:pointer;line-height:1;padding:4px}

/* ---------- key legend ---------- */
.legend{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--legbg);backdrop-filter:blur(6px);
  border-top:1px solid var(--line);
  padding:8px 20px calc(8px + env(safe-area-inset-bottom));
  display:flex;gap:18px;justify-content:center;flex-wrap:wrap;
  font-size:12px;color:var(--muted);
}
kbd{font-family:'Archivo';font-weight:700;font-size:11px;background:var(--card);
  border:1px solid var(--line);border-bottom-width:2.5px;border-radius:4px;padding:1px 6px;color:var(--ink)}
.legend .kg kbd{border-color:var(--green);color:var(--green)}
.legend .kf kbd{border-color:var(--red);color:var(--red)}
.legend .kd kbd{border-color:var(--delft);color:var(--delft)}

.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,10px);z-index:90;
  background:var(--sheetbg);color:#F2F5FB;border:1px solid rgba(255,255,255,.16);
  border-radius:10px;padding:10px 16px;font-size:13px;font-weight:500;
  opacity:0;pointer-events:none;max-width:min(90vw,420px);text-align:center;
  box-shadow:var(--shadow-sheet)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.storage-note{font-size:11.5px;color:var(--muted);padding:8px 0 0}
.storage-note.err{color:var(--red)}
.tip{margin-top:9px;font-size:12.5px;color:var(--delft);background:rgba(31,79,163,.07);
  border:1px dashed var(--delft);border-radius:8px;padding:7px 11px}


/* ---------- modes & sections ---------- */
.modes{display:flex;gap:6px;padding:12px 0 2px;flex-wrap:wrap}
.fbtn{font-family:'Archivo';font-weight:700;font-size:12.5px;letter-spacing:.01em;
  background:var(--card);color:var(--muted);border:1.5px dashed var(--line);
  border-radius:999px;padding:6px 14px;cursor:pointer}
.fbtn:hover{border-color:var(--tulip);color:var(--tulip)}
.fbtn.active{background:var(--tulip);border-color:var(--tulip);border-style:solid;color:#fff}
.modesep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.empty{padding:48px 0;color:var(--muted);font-size:14.5px;text-align:center}
.card .art.de{color:var(--delft);font-weight:700}
.card .art.het{color:var(--tulip);font-weight:700}
.sheet .ex{cursor:pointer}
.mbtn{font-family:'Archivo';font-weight:700;font-size:12.5px;letter-spacing:.01em;
  background:var(--card);color:var(--muted);border:1.5px solid var(--line);
  border-radius:999px;padding:6px 14px;cursor:pointer}
.mbtn:hover{border-color:var(--delft);color:var(--delft)}
.mbtn.active{background:var(--activebg);border-color:var(--activebg);color:var(--activefg)}
.sect{margin-top:8px}
.secthead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:16px 0 2px;border-bottom:1px solid var(--line);margin-bottom:4px}
.sectt{font-family:'Archivo';font-weight:800;font-size:15px;letter-spacing:-.01em}
.badge{font-family:'Inter';font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  border-radius:4px;padding:2px 7px}
.badge.new{background:var(--tulip);color:#fff}
.badge.rev{background:#E4E9F4;color:var(--delft)}
.badge.mix{background:var(--delft);color:#fff}
.seccnt{margin-left:auto;font-size:11.5px;color:var(--muted)}
.peak.inrange .lbl{color:var(--ink)}
.sheet .conj{margin-top:10px;font-size:13px;color:#9FB0D3;line-height:1.5;
  border-top:1px solid #2A3D6B;padding-top:8px}
.sheet .conj .conjlab{display:block;font-size:9.5px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--tulip);margin-bottom:2px}

.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.segb{border:none;background:none;padding:6px 13px;font-family:'Archivo';font-weight:800;font-size:12px;
  letter-spacing:.05em;color:var(--muted);cursor:pointer}
.segb.active{background:var(--activebg);color:var(--activefg)}
.helpb{display:inline-flex;align-items:center;gap:6px;font-family:'Archivo';font-weight:700;font-size:12.5px}
.tgl.on{border-style:solid;border-color:var(--tulip);color:var(--tulip)}
.peak.summit .bar{overflow:visible}
.peak.summit .bar::before{content:"";position:absolute;top:-13px;left:calc(50% - 1px);width:2px;height:13px;background:var(--ink)}
.peak.summit .bar::after{content:"";position:absolute;top:-13px;left:calc(50% + 1px);width:0;height:0;
  border-left:10px solid var(--tulip);border-top:4px solid transparent;border-bottom:4px solid transparent}
.scbtn{font-family:'Archivo';font-weight:700;font-size:12.5px;letter-spacing:.01em;
  background:var(--card);color:var(--muted);border:1.5px solid var(--line);
  border-radius:999px;padding:6px 14px;cursor:pointer}
.scbtn:hover{border-color:var(--delft);color:var(--delft)}
.scbtn.active{background:var(--delft);border-color:var(--delft);color:#fff}
.overlay{position:fixed;inset:0;background:rgba(8,12,24,.6);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:18px}
.overlay[hidden]{display:none}
.help{background:var(--card);color:var(--ink);max-width:660px;width:100%;max-height:84vh;
  overflow:auto;border-radius:12px;border:1.5px solid var(--line);padding:22px 26px;position:relative}
.help h2{font-family:'Archivo';font-weight:900;font-size:21px;margin:0 0 8px;letter-spacing:-.01em}
.help h3{font-family:'Archivo';font-weight:800;font-size:13.5px;margin:16px 0 4px;color:var(--delft);
  letter-spacing:.04em;text-transform:uppercase}
.help p,.help li{font-size:13.5px;line-height:1.6}
.help ul{padding-left:18px;margin:4px 0}
.help .close{position:absolute;top:8px;right:12px;background:none;border:none;font-size:22px;
  color:var(--muted);cursor:pointer;line-height:1;padding:4px}
.help a{color:var(--tulip);font-weight:600}
.help .gh{margin-top:16px;padding:11px 13px;border:1.5px dashed var(--tulip);border-radius:8px;font-size:13.5px}
.ten{font-family:'Inter';font-weight:500;font-size:.68em;color:var(--muted);letter-spacing:0}
.hright{display:flex;align-items:center;gap:12px}
.theme{background:var(--card);border:1.5px solid var(--line);border-radius:8px;
  font-size:15px;padding:5px 10px;cursor:pointer;line-height:1}
.theme:hover{border-color:var(--delft)}

@media (max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:6px}
  .card{font-size:14px;padding:11px 6px 10px}
  .sheet{padding:13px 16px calc(12px + env(safe-area-inset-bottom));max-height:72vh;overflow:auto}
  .sheet-inner{gap:8px}
  .sheet .word{font-size:24px;min-width:0}
  .sheet .pos{margin-top:5px}
  .sheet .en{font-size:16px}
  .sheet .ex{font-size:13px}
  .sheet .conj{font-size:12px;margin-top:8px;padding-top:6px}
  .sheet-actions{margin-left:0;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #btnG{order:1}
  #btnF{order:2}
  #btnSpeak{order:3}
  #btnX{order:4}
  .sbtn{text-align:center;padding:11px 10px;min-height:44px}
  .mbtn,.fbtn,.scbtn,.reset{min-height:36px}
  .toast{bottom:16px}
  .legend{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{transition:transform .12s ease-out}
  .card{transition:background .08s,border-color .08s,box-shadow .1s,transform .1s}
  .peak{transition:transform .1s}
  .peak:hover{transform:translateY(-2px)}
  .peak .fill{transition:height .18s ease-out}
  .progress-fill{transition:width .25s ease-out}
  .toast{transition:opacity .15s,transform .15s}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">DE VOCAB<span class="accent">BERG</span>
      <small data-i18n="brandSub">1020 woorden &middot; A0 &rarr; A2 &middot; GregMat-stijl cumulatief</small>
    </div>
    <div class="hright">
      <div class="totals">
        <div class="big"><span id="totGreen">0</span> / 1020</div>
        <div class="sub"><span data-i18n="subTotals">woorden gekend</span> &middot; <span id="totPct">0%</span> <span data-i18n="subBerg">van de berg</span></div>
      </div>
      <div class="seg" id="langSeg" role="group" aria-label="Interface language">
        <button class="segb active" data-lang="nl">NL</button>
        <button class="segb" data-lang="en">EN</button>
      </div>
      <button class="theme helpb" id="helpBtn">&#128214; <span data-i18n="guide">Gids</span></button>
      <button class="theme" id="themeBtn" title="Licht / donker &middot; Light / dark">&#127769;</button>
    </div>
  </header>
  <div class="progress" aria-hidden="true"><div class="progress-fill" id="progFill"></div></div>

  <nav class="mountain" id="mountain" aria-label="Dagen"></nav>

  <div class="panel">
  <div class="dayhead">
    <h2 id="dayTitle">Dag 1 — <em>…</em></h2>
    <div class="daymeta">
      <span class="g" id="dayG">0 gekend</span>
      <span class="r" id="dayR">0 vergeten</span>
      <button class="reset" id="resetBtn" title="Wis markeringen van deze dag">reset dag</button>
      <button class="reset" id="expBtn" title="Kopieer je voortgang als code (voor ander apparaat of back-up)">export</button>
      <button class="reset" id="impBtn" title="Plak een voortgang-code van een ander apparaat">import</button>
      <button class="reset tgl" id="idxBtn" title="Toon/verberg nummers op kaartjes">#</button>
      <button class="reset tgl" id="autoBtn" title="Spreek elk woord uit bij navigeren">&#128266; auto: uit</button>
    </div>
  </div>
  <div class="routine" id="routine"></div>
  <div class="tip" id="tip" hidden></div>
  <div class="modes">
    <button class="scbtn active" data-sc="cum" id="scCum">Dag 1&ndash;1</button>
    <button class="scbtn" data-sc="solo" id="scSolo">Alleen dag 1</button>
    <span class="modesep"></span>
    <button class="mbtn active" data-m="order" data-i18n="mOrder">Op volgorde</button>
    <button class="mbtn" data-m="sday" data-i18n="mSday">Schud per dag</button>
    <button class="mbtn" data-m="sall" data-i18n="mSall">Alles gemengd</button>
    <span class="modesep"></span>
    <button class="fbtn active" data-f="all" data-i18n="fAll">Alles</button>
    <button class="fbtn" data-f="forgot" data-i18n="fForgot">Alleen vergeten</button>
    <button class="fbtn" data-f="unmarked" data-i18n="fUnmarked">Alleen ongemarkeerd</button>
  </div>
  <div class="storage-note" id="storageNote"></div>
  <div class="storage-note" id="ttsNote"></div>

  </div>

  <main id="sections"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="legend">
  <span class="kg"><kbd>G</kbd> <span data-i18n="lgKnown">gekend</span></span>
  <span class="kf"><kbd>F</kbd> <span data-i18n="lgForgot">vergeten</span></span>
  <span class="kd"><kbd>D</kbd> <span data-i18n="lgDef">definitie</span></span>
  <span><kbd>X</kbd> <span data-i18n="lgClear">wissen</span></span>
  <span><kbd>&larr;&rarr;&uarr;&darr;</kbd> <span data-i18n="lgNav">navigeren</span></span>

/* ================= storage: artifact -> localStorage -> memory ================= */
function lsOK(){
  try{ localStorage.setItem("__vb_t","1"); localStorage.removeItem("__vb_t"); return true; }
  catch(e){ return false; }
}
const backend = window.storage ? "artifact" : (lsOK() ? "local" : "none");
function applyState(s){
  marks = s.marks || {};
  day = Math.min(s.day || 0, DATA.length-1);
  if(s.theme) theme = s.theme;
  if(s.lang) lang = s.lang;
  if(s.scope) scope = s.scope;
  if(typeof s.autoSpeak === "boolean") autoSpeak = s.autoSpeak;
  if(typeof s.showIdx === "boolean") showIdx = s.showIdx;
  if(typeof s.tipSeen === "boolean") tipSeen = s.tipSeen;
}
function snapshot(){ return JSON.stringify({marks:marks, day:day, theme:theme, lang:lang, scope:scope, autoSpeak:autoSpeak, showIdx:showIdx, tipSeen:tipSeen}); }
async function load(){
  try{
    if(backend==="artifact"){
      const r = await window.storage.get(KEY);
      if(r && r.value) applyState(JSON.parse(r.value));
    } else if(backend==="local"){
      const r = localStorage.getItem(KEY);
      if(r) applyState(JSON.parse(r));
    } else { mem = true; }
  }catch(e){ /* key not found is fine */ }
  if(!theme) theme = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  applyTheme();
  if(mem){ $("storageNote").textContent = t("storageNone"); $("storageNote").classList.add("err"); }
}
function save(){
  if(backend==="none") return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      if(backend==="artifact") await window.storage.set(KEY, snapshot());
      else localStorage.setItem(KEY, snapshot());
    }catch(e){ /* ignore transient */ }
  }, 350);
}

/* ================= conjugation (tegenwoordige tijd) ================= */
const isV = c => "aeiou".includes(c);
const IRR = {
  zijn:["ben","bent","is"], hebben:["heb","hebt","heeft"], kunnen:["kan","kunt","kan"],
  willen:["wil","wilt","wil"], mogen:["mag","mag","mag"], moeten:["moet","moet","moet"],
  zullen:["zal","zult","zal"], gaan:["ga","gaat","gaat"], staan:["sta","staat","staat"],
  doen:["doe","doet","doet"], zien:["zie","ziet","ziet"], komen:["kom","komt","komt"]
};
const SEP = {
  opstaan:["op","staan"], aankomen:["aan","komen"], inchecken:["in","checken"], uitchecken:["uit","checken"],
  meenemen:["mee","nemen"], aantrekken:["aan","trekken"], uittrekken:["uit","trekken"], uitnodigen:["uit","nodigen"],
  oversteken:["over","steken"], overstappen:["over","stappen"], invullen:["in","vullen"], weggooien:["weg","gooien"],
  afwassen:["af","wassen"], opladen:["op","laden"], inschrijven:["in","schrijven"], aanvragen:["aan","vragen"],
  uitleggen:["uit","leggen"], inloggen:["in","loggen"], uitloggen:["uit","loggen"], opnemen:["op","nemen"],
  schoonmaken:["schoon","maken"], hardlopen:["hard","lopen"]
};
const STEMX = {
  luisteren:"luister", veranderen:"verander", tekenen:"teken", ondertekenen:"onderteken",
  openen:"open", oefenen:"oefen", winkelen:"winkel", wandelen:"wandel", schilderen:"schilder",
  betekenen:"beteken", recyclen:"recycle", appen:"app", downloaden:"download", antwoorden:"antwoord"
};
const HET = { regenen:"regent", sneeuwen:"sneeuwt", vriezen:"vriest", waaien:"waait", gebeuren:"gebeurt" };

function stem(inf){
  if(STEMX[inf]) return STEMX[inf];
  let s = inf.slice(0,-2);
  const n = s.length;
  if(n>=2 && s[n-1]===s[n-2] && !isV(s[n-1])){
    s = s.slice(0,-1);
  } else if(n>=2 && !isV(s[n-1]) && s[n-1]!=="w" && isV(s[n-2]) && s[n-2]!=="i" && (n<3 || !isV(s[n-3]))){
    s = s.slice(0,n-1) + s[n-2] + s[n-1];
  }
  if(s.endsWith("v")) s = s.slice(0,-1)+"f";
  if(s.endsWith("z")) s = s.slice(0,-1)+"s";
  return s;
}
function parts(inf){
  if(IRR[inf]) return IRR[inf];
  const s = stem(inf);
  const tt = s + (s.endsWith("t") ? "" : "t");
  return [s,tt,tt];
}
function conjLine(nl,pos){
  if(pos !== "werkwoord") return "";
  if(nl === "houden van") return "ik hou van \u00b7 jij houdt van \u00b7 hij/zij houdt van \u00b7 wij houden van";
  if(HET[nl]) return "het " + HET[nl] + " \u2014 onpersoonlijk werkwoord (impersonal: only with 'het')";
  if(SEP[nl]){
    const pre = SEP[nl][0], base = SEP[nl][1];
    const p = parts(base);
    return "ik "+p[0]+" "+pre+" \u00b7 jij "+p[1]+" "+pre+" \u00b7 hij/zij "+p[2]+" "+pre+" \u00b7 wij "+base+" "+pre+"  (scheidbaar werkwoord / separable)";
  }
  const p = parts(nl);
  return "ik "+p[0]+" \u00b7 jij/u "+p[1]+" \u00b7 hij/zij "+p[2]+" \u00b7 wij/jullie/zij "+nl;
}

/* ================= pronunciation ================= */
let NLVOICE = null;
function pickVoice(){
  if(!window.speechSynthesis) return;
  const vs = speechSynthesis.getVoices();
  NLVOICE = vs.find(v=> /google/i.test(v.name) && /nl[-_]NL/i.test(v.lang))
         || vs.find(v=> /google/i.test(v.name) && v.lang && v.lang.toLowerCase().startsWith("nl"))
         || vs.find(v=> /nl[-_]NL/i.test(v.lang))
         || vs.find(v=> v.lang && v.lang.toLowerCase().startsWith("nl"))
         || vs.find(v=> /nederlands|dutch/i.test(v.name))
         || null;
}
if(window.speechSynthesis){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function cleanSpeech(t){
  return t
    .replace(/\(.*?\)/g, " ")
    .replace(/\s*\/\s*/g, ", ")
    .replace(/\s+/g, " ").trim();
}
function speak(txt, retried){
  try{
    if(!window.speechSynthesis || !txt) return;
    if(speechSynthesis.getVoices().length===0 && !retried){
      setTimeout(()=>{ pickVoice(); speak(txt, true); }, 300);
      return;
    }
    if(!NLVOICE) pickVoice();
    const u = new SpeechSynthesisUtterance(cleanSpeech(txt));
    u.lang = "nl-NL";
    u.rate = 0.85;
    if(NLVOICE){
      u.voice = NLVOICE;
      $("ttsNote").textContent = "";
      $("ttsNote").classList.remove("err");
    } else {
      $("ttsNote").textContent = t("noVoiceShort");
      $("ttsNote").classList.add("err");
    }
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){ /* no voice available */ }
}
let toastTimer = null;
function showToast(msg){
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove("show"), 1900);
}
function speakCur(){
  const it = VIS[cur];
  if(it) speak(DATA[it.d].w[it.i][0]);
}

function renderMountain(){
  const n = DATA.length;
  const el = $("mountain");
  el.innerHTML = "";
  for(let d=0; d<n; d++){
    const g = dayGreen(d);
    const h = 26 + Math.round((d/(n-1))*54);
    const b = document.createElement("button");
    b.className = "peak" + (d===day?" active":"") + (g===30?" done":"") + (d<=day?" inrange":"") + (d===n-1?" summit":"");
    b.innerHTML =
      '<div class="bar" style="height:'+h+'px">' +
        '<div class="fill'+(g<30?" partial":"")+'" style="height:'+Math.round(g/30*100)+'%"></div>' +
      '</div>' +
      '<span class="lbl">'+t("day")+' '+(d+1)+'</span>' +
      '<span class="cnt">'+g+'/30</span>';
    b.onclick = ()=>{ setDay(d); };
    el.appendChild(b);
  }
  const act = el.querySelector(".peak.active");
  if(act) act.scrollIntoView({inline:"center", block:"nearest"});
}

/* ================= cumulative view ================= */
function shuffleArr(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function passFilter(it){
  const m = marks[key(it.d,it.i)];
  if(filter==="forgot") return m===2;
  if(filter==="unmarked") return m===undefined;
  return true;
}
function startDay(){ return scope==="solo" ? day : 0; }
function buildSections(){
  if(mode==="sall"){
    const all=[];
    for(let d=startDay();d<=day;d++) DATA[d].w.forEach((w,i)=>all.push({d:d,i:i}));
    const kept = all.filter(passFilter);
    shuffleArr(kept);
    return kept.length ? [{d:null, items:kept}] : [];
  }
  const secs=[];
  for(let d=startDay();d<=day;d++){
    let idx = DATA[d].w.map((w,i)=>i).filter(i=>passFilter({d:d,i:i}));
    if(!idx.length) continue;
    if(mode==="sday") shuffleArr(idx);
    secs.push({d:d, items: idx.map(i=>({d:d,i:i}))});
  }
  return secs;
}
function splitArticle(nl){
  if(nl.startsWith("de ")) return ["de", nl.slice(3)];
  if(nl.startsWith("het ")) return ["het", nl.slice(4)];
  return ["", nl];
}
function renderGrid(){
  const root = $("sections");
  root.innerHTML = ""; VIS=[]; ELS=[]; SECCOUNTS=[];
  const secs = buildSections();
  secs.forEach(sec=>{
    const s = document.createElement("section");
    s.className = "sect";
    const h = document.createElement("div");
    h.className = "secthead";
    if(sec.d===null){
      h.innerHTML = '<span class="sectt">'+fmt("allMixed",{n:sec.items.length})+'</span>' +
        '<span class="badge mix">'+t("day").toLowerCase()+' '+(startDay()+1)+'\u2013'+(day+1)+'</span><span class="seccnt"></span>';
    } else {
      const tag = sec.d===day
        ? '<span class="badge new">'+t("neww")+'</span>'
        : '<span class="badge rev">'+t("review")+'</span>';
      h.innerHTML = '<span class="sectt">'+t("day")+' '+(sec.d+1)+' \u2014 '+DATA[sec.d].t+' <span class="ten">('+T_EN[sec.d]+')</span></span>'+tag+'<span class="seccnt"></span>';
    }
    s.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "grid";
    sec.items.forEach(it=>{
      const v = VIS.length;
      VIS.push(it);
      const w = DATA[it.d].w[it.i];
      const p = splitArticle(w[0]);
      const c = document.createElement("div");
      c.className = "card";
      const tagNo = (mode==="sall") ? (it.d+1)+"."+(it.i+1) : (it.i+1);
      c.innerHTML = '<span class="idx">'+tagNo+'</span>' +
        (p[0] ? '<span class="art '+p[0]+'">'+p[0]+'</span>' : '<span class="art">&nbsp;</span>') +
        p[1];
      c.onclick = ()=>{ go(v); };
      c.ondblclick = ()=>{ go(v); openSheet(); };
      ELS.push(c);
      grid.appendChild(c);
    });
    s.appendChild(grid);
    root.appendChild(s);
    SECCOUNTS.push({el: h.querySelector(".seccnt"), items: sec.items});
  });
  if(!VIS.length){
    root.innerHTML = '<div class="empty">⛰️ '+(filter==="forgot" ? t("emptyForgot") : t("emptyOther"))+'</div>';
  }
  if(cur >= VIS.length) cur = 0;
  syncAllMarks();
  syncCursor(false);
}
function syncAllMarks(){
  VIS.forEach((it,v)=>{
    const m = marks[key(it.d,it.i)];
    ELS[v].classList.toggle("g", m===1);
    ELS[v].classList.toggle("r", m===2);
  });
  SECCOUNTS.forEach(sc=>{
    let g=0,r=0;
    sc.items.forEach(it=>{
      const m = marks[key(it.d,it.i)];
      if(m===1) g++; else if(m===2) r++;
    });
    sc.el.textContent = g+" \u2713 \u00b7 "+r+" \u2717 \u00b7 "+sc.items.length+" "+t("words");
  });
  let g=0,r=0;
  VIS.forEach(it=>{
    const m = marks[key(it.d,it.i)];
    if(m===1) g++; else if(m===2) r++;
  });
  $("dayG").textContent = g+" "+t("known2");
  $("dayR").textContent = r+" "+t("forgot2");
  const tg = totalGreen();
  $("totGreen").textContent = tg;
  $("totPct").textContent = Math.round(tg/1020*100)+"%";
  $("progFill").style.width = (tg/1020*100).toFixed(1)+"%";
}
function syncCursor(scroll=true){
  ELS.forEach((el,v)=> el.classList.toggle("cur", v===cur));
  if(scroll && ELS[cur]) ELS[cur].scrollIntoView({block:"nearest"});
  if(sheetOpen) fillSheet();
}
function go(v){
  cur = v;
  syncCursor();
  if(autoSpeak) speakCur();
}

function setDay(d){
  day = Math.max(0, Math.min(DATA.length-1, d));
  cur = 0;
  closeSheet();
  const tot = (day+1)*30;
  $("dayTitle").innerHTML = t("day")+" "+(day+1)+" \u2014 <em>"+DATA[day].t+"</em> <span class=\"ten\">("+T_EN[day]+")</span>";
  const cumLbl = t("day")+" 1\u2013"+(day+1);
  $("scCum").textContent = cumLbl;
  $("scSolo").textContent = t("soloOnly")+" "+(day+1);
  if(scope==="solo"){
    $("routine").innerHTML = fmt("routineSolo",{n:day+1, cum:cumLbl});
  } else if(day===0){
    $("routine").innerHTML = t("routineD1");
  } else {
    $("routine").innerHTML = fmt("routineCum",{tot:tot, n:day+1});
  }
  $("resetBtn").innerHTML = "&#8634; "+t("reset")+" "+(day+1);
  renderGrid();
  renderMountain();
  save();
}
function setMode(m){
  mode = m; cur = 0; closeSheet();
  document.querySelectorAll(".mbtn").forEach(b=> b.classList.toggle("active", b.dataset.m===mode));
  renderGrid();
}
function setFilter(f){
  filter = f; cur = 0; closeSheet();
  document.querySelectorAll(".fbtn").forEach(b=> b.classList.toggle("active", b.dataset.f===filter));
  renderGrid();
}
function setScope(sc){
  scope = sc; cur = 0; closeSheet();
  document.querySelectorAll(".scbtn").forEach(b=> b.classList.toggle("active", b.dataset.sc===scope));
  setDay(day);
  save();
}

/* ================= sheet ================= */
let sheetOpen = false;
let lastExNL = "";
function updateSheetPad(){
  const wrap = document.querySelector(".wrap");
  if(sheetOpen){
    const h = $("sheet").offsetHeight;
    wrap.style.paddingBottom = (h + 28) + "px";
    document.documentElement.style.setProperty("--sheetpad", (h + 16) + "px");
  } else {
    wrap.style.paddingBottom = "";
    document.documentElement.style.setProperty("--sheetpad", "0px");
  }
}
window.addEventListener("resize", ()=>{ if(sheetOpen) updateSheetPad(); });
function fillSheet(){
  const it = VIS[cur];
  if(!it) return;
  const w = DATA[it.d].w[it.i];
  $("shWord").textContent = w[0];
  $("shPos").textContent = w[2] + " \u00b7 " + t("day").toLowerCase() + " " + (it.d+1);
  $("shEn").textContent = w[1];
  const ex = w[3] || "";
  const sp = ex.split(" = ");
  lastExNL = sp.length===2 ? sp[0] : "";
  $("shEx").innerHTML = sp.length===2 ? "<b>"+sp[0]+"</b><br>"+sp[1] : ex;
  $("shEx").title = lastExNL ? "Klik om de zin te horen / click to hear" : "";
  const cl = conjLine(w[0], w[2]);
  $("shConj").innerHTML = cl ? '<span class="conjlab">'+t("presTense")+'</span>'+cl : "";
  $("shConj").style.display = cl ? "" : "none";
  if(sheetOpen) requestAnimationFrame(updateSheetPad);
}
function openSheet(){
  fillSheet();
  $("sheet").classList.add("open");
  sheetOpen = true;
  if(!tipSeen){ tipSeen = true; $("tip").hidden = true; save(); }
  requestAnimationFrame(()=>{
    updateSheetPad();
    if(ELS[cur]) ELS[cur].scrollIntoView({block:"nearest"});
  });
}
function closeSheet(){
  $("sheet").classList.remove("open");
  sheetOpen = false;
  updateSheetPad();
}
function toggleSheet(){ sheetOpen ? closeSheet() : openSheet(); }

/* ================= help ================= */
let helpOpen = false;
function openHelp(){ $("helpOverlay").hidden = false; helpOpen = true; }
function closeHelp(){ $("helpOverlay").hidden = true; helpOpen = false; }

/* ================= actions ================= */
function mark(v){
  const it = VIS[cur];
  if(!it) return;
  const k = key(it.d, it.i);
  if(v===0) delete marks[k]; else marks[k] = v;
  syncAllMarks();
  renderMountain();
  save();
  if(v!==0){
    closeSheet();
    if(cur < VIS.length-1) go(cur+1);
  }
}
function cols(){
  const g = document.querySelector(".grid");
  if(!g) return 1;
  return getComputedStyle(g).gridTemplateColumns.split(" ").length;
}

document.addEventListener("keydown", e=>{
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(helpOpen){
    if(e.key==="Escape") closeHelp();
    return;
  }
  const n = VIS.length;
  if(!n && e.key.toLowerCase()!=="[" && e.key.toLowerCase()!=="]") return;
  switch(e.key.toLowerCase()){
    case "g": mark(1); break;
    case "f": mark(2); break;
    case "x": mark(0); break;
    case "d": toggleSheet(); break;
    case "s": setMode(mode==="order" ? "sday" : mode); break;
    case "p": speakCur(); break;
    case "enter": toggleSheet(); e.preventDefault(); break;
    case "escape": closeSheet(); break;
    case "arrowright": case "l": go((cur+1)%n); e.preventDefault(); break;
    case "arrowleft": case "h": go((cur-1+n)%n); e.preventDefault(); break;
    case "arrowdown": case "j": go(Math.min(n-1,cur+cols())); e.preventDefault(); break;
    case "arrowup": case "k": go(Math.max(0,cur-cols())); e.preventDefault(); break;
    case "[": setDay(day-1); break;
    case "]": setDay(day+1); break;
  }
});

$("btnG").onclick = ()=>mark(1);
$("btnF").onclick = ()=>mark(2);
$("btnX").onclick = ()=>mark(0);
$("btnSpeak").onclick = speakCur;
$("sheetClose").onclick = closeSheet;
$("shEx").onclick = ()=>{ if(lastExNL) speak(lastExNL); };
$("resetBtn").onclick = ()=>{
  if(!confirm(fmt("resetConfirm",{n:day+1}))) return;
  DATA[day].w.forEach((w,i)=> delete marks[key(day,i)]);
  syncAllMarks(); renderMountain(); save();
};
$("expBtn").onclick = async ()=>{
  const code = snapshot();
  try{ await navigator.clipboard.writeText(code); showToast(t("expOk")); }
  catch(e){ prompt(t("expCopy"), code); }
};
$("impBtn").onclick = ()=>{
  const txt = prompt(t("impAsk"));
  if(!txt) return;
  try{
    const s = JSON.parse(txt);
    if(!s || typeof s !== "object" || !s.marks) throw 0;
    applyState(s);
    applyTheme(); applyLang();
    document.querySelectorAll(".scbtn").forEach(b=> b.classList.toggle("active", b.dataset.sc===scope));
    setDay(day);
    save();
    showToast(t("impOk"));
  }catch(e){ showToast(t("impBad")); }
};
$("autoBtn").onclick = ()=>{
  autoSpeak = !autoSpeak;
  applyLang();
  save();
  if(autoSpeak) speakCur();
};
$("themeBtn").onclick = ()=>{ theme = theme==="dark" ? "light" : "dark"; applyTheme(); save(); };
function setLang(l){
  if(lang===l) return;
  lang = l;
  applyLang();
  document.querySelectorAll(".scbtn").forEach(b=> b.classList.toggle("active", b.dataset.sc===scope));
  setDay(day);
  save();
}
document.querySelectorAll("#langSeg .segb").forEach(b=>{ b.onclick = ()=> setLang(b.dataset.lang); });
$("idxBtn").onclick = ()=>{
  showIdx = !showIdx;
  document.body.classList.toggle("show-idx", showIdx);
  applyLang();
  save();
};
$("helpBtn").onclick = openHelp;
$("helpClose").onclick = closeHelp;
$("helpOverlay").onclick = e=>{ if(e.target===$("helpOverlay")) closeHelp(); };
document.addEventListener("click", e=>{
  if(!sheetOpen) return;
  if(e.target.closest(".sheet") || e.target.closest(".card")) return;
  closeSheet();
});
document.querySelectorAll(".mbtn").forEach(b=>{ b.onclick = ()=> setMode(b.dataset.m); });
document.querySelectorAll(".fbtn").forEach(b=>{ b.onclick = ()=> setFilter(b.dataset.f); });
document.querySelectorAll(".scbtn").forEach(b=>{ b.onclick = ()=> setScope(b.dataset.sc); });

async function init(){
  await load();
  document.body.classList.toggle("show-idx", showIdx);
  applyLang();
  document.querySelectorAll(".scbtn").forEach(b=> b.classList.toggle("active", b.dataset.sc===scope));
  setDay(day);
}
</script>
